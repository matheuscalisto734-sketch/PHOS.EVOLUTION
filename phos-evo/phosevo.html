<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="PHOS.EVO — a importância da fotografia na sociedade e na história.">
    <title>Phos.Evolution</title>
    <link rel="stylesheet" href="phos.css">
    <link rel="icon" type="image/svg+xml" href="assets/icons/logo-lens.svg">
    <script>document.documentElement.classList.add('js')</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/phos.css">
    <link rel="stylesheet" href="css/sections.css">
    <link rel="stylesheet" href="css/camera.css">
</head>
<body>

<!-- Símbolo reutilizável (cadeado do dock da câmera) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="i-lock" viewBox="0 0 24 24"><path d="M7 11V8a5 5 0 0 1 10 0v3M5 11h14v10H5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
</svg>

<!-- A classe is-capturing dispara a animação de "captura" ao carregar (navbar + título) -->
<section class="hero-section is-capturing" id="top">

    <!-- ===== FUNDO ===== -->
    <div class="hero-media" aria-hidden="true">
        <!-- Modo "contain" (vídeo inteiro com sobras borradas)? Descomente este bloco
             e troque --video-fit para contain no phos.css:
        <video class="bg-video bg-video--ambient" autoplay muted loop playsinline
               preload="auto" tabindex="-1" disablepictureinpicture poster="assets/videos/poster.jpg">
            <source src="assets/videos/fundo-blur.mp4" type="video/mp4">
        </video>
        -->

        <!-- Vídeo principal: preenche a tela toda (object-fit: cover, ver --video-fit no CSS) -->
        <video class="bg-video bg-video--main" autoplay muted loop playsinline
               preload="auto" tabindex="-1" disablepictureinpicture
                poster="assets/videos/poster.jpg">
            <source src="assets/videos/fundo math.mp4" type="video/mp4">
        </video>

        <!-- Película escura para destacar o conteúdo -->
        <div class="overlay"></div>
    </div>

        <a class="logo-link" href="#" aria-label="Phos.Evo — início">

            <span class="corner tr" aria-hidden="true"></span>
            <span class="corner bl" aria-hidden="true"></span>
            <span class="corner br" aria-hidden="true"></span>
            <span class="logo-icon">
                <img src="assets/icons/logo-lens.svg" alt="">

        </a>

        <div class="nav-actions">
            <button class="icon-btn camera-btn" type="button" data-light aria-label="Modo câmera" aria-pressed="false">
                <img src="assets/icons/btn-camera.svg" alt="">
                <span class="cam-count" hidden>0</span>
                <svg class="spark" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 0C12.7 7 17 11.3 24 12C17 12.7 12.7 17 12 24C11.3 17 7 12.7 0 12C7 11.3 11.3 7 12 0Z"/>
                </svg>
            </button>

            <button class="icon-btn menu-btn light-btn" type="button" data-light aria-label="Menu" aria-expanded="false" aria-controls="menu">
                <img src="assets/icons/icon-menu.svg" alt="">
            </button>
        </div>

        <nav class="menu-panel" id="menu" aria-label="Menu principal" hidden>
            <a href="#top">Início</a>
            <a href="#sobre">Sobre</a>
            <a href="#experimento">Experimento</a>
            <a href="#contato">Contato</a>
        </nav>
    </header>

    <!-- ===== CONTEÚDO CENTRAL ===== -->
    <main class="hero-content">
        <div class="hero-stack">

            <h1 class="title-frame">
                <span class="sr-only">Phos.Evolution</span>

                <!-- Os 4 colchetes do visor da câmera -->
                <span class="corner tl" aria-hidden="true"></span>
                <span class="corner tr" aria-hidden="true"></span>
                <span class="corner bl" aria-hidden="true"></span>
                <span class="corner br" aria-hidden="true"></span>

                <img class="title-img" src="assets/icons/title.svg" alt="" draggable="false">
            </h1>

            <p class="hero-subtitle">Fotografia para<br>além do registro</p>
        </div>
    </main>

    <!-- ===== RODAPÉ DA HERO ===== -->
    <div class="hero-footer">
        <a class="plane-btn" href="#contato" aria-label="Contato">
            <img src="assets/icons/icon-plane.svg" alt="">
        </a>

        <a href="#sobre" class="explore-btn" data-light>
            <span class="explore-label">Explorar</span>
            <span class="arrow-pill light-btn light-target">
                <svg class="arrow" viewBox="0 0 48 16" aria-hidden="true">
                    <path d="M1 8H46M39 1.5L46 8L39 14.5" fill="none" stroke="currentColor"
                          stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </span>
        </a>
    </div>

    <!-- Flash de tela cheia (disparado ao clicar no botão da câmera) -->
    <div class="flash-overlay" aria-hidden="true"></div>

</section>

<div id="conteudo">

<div class="divider divider--light" aria-hidden="true">
    <svg class="divider-notch" viewBox="0 0 80 24"><path d="M0 23C28 23 29 2 40 2S52 23 80 23"/></svg>
    <img class="divider-line" src="assets/img/divisor-linha.svg" alt="">
    <img class="divider-star" src="assets/img/divisor-estrela.svg" alt="">
</div>

<!-- ================= SOBRE ================= -->
<section id="sobre" class="sobre">
    <img class="blob blob--esq"   src="assets/img/blob-esq-verde.svg"   alt="" aria-hidden="true">
    <img class="blob blob--dir"   src="assets/img/blob-dir-laranja.svg" alt="" aria-hidden="true">
    <img class="blob blob--baixo" src="assets/img/blob-esq-azul.svg"    alt="" aria-hidden="true">

    <div class="wrap">
        <div class="sobre-head">
            <button class="fragment fragment--cor" type="button" data-fragment="desfoque"
                    aria-label="Fragmento do obturador escondido. Clique para coletar">
                <img src="assets/img/star-cor.svg" alt="" draggable="false">
            </button>
            <h2><img class="txt txt-sobre" src="assets/img/txt-sobre.svg" alt="Sobre" draggable="false"></h2>
        </div>
        <p class="sobre-brand"><img class="txt txt-brand" src="assets/img/txt-phos-evolution.svg" alt="PHOS.EVOLUTION" draggable="false"></p>

        <div class="note note--right reveal">
            <span class="corner tl" aria-hidden="true"></span><span class="corner bl" aria-hidden="true"></span>
            <img class="txt " src="assets/img/txt-nota-1.svg" alt="PHOS.EVO é a junção da luz com a evolução, trazendo o processo de descobrimento da fotografia e todo o seu conceito de forma dinâmica e intuitiva." draggable="false">
        </div>

        <div class="note note--left reveal">
            <span class="corner tr" aria-hidden="true"></span><span class="corner br" aria-hidden="true"></span>
            <img class="txt " src="assets/img/txt-nota-2.svg" alt="O mundo já está muito sem saturação, que tal deixar ele mais vivo com PHOS.EVO." draggable="false">
        </div>

        <div class="try">
            <p class="try-text"><img class="txt " src="assets/img/txt-experimente-camera.svg" alt="Experimente usar a câmera para colorir essa foto" draggable="false"></p>
            <img class="chev" src="assets/img/chevron-baixo.svg" alt="" aria-hidden="true">

            <div class="photo-card reveal">
                <div class="photo-stage" id="photo-stage">
                    <img class="photo-blur" src="assets/img/foto-demo.jpg" alt="" aria-hidden="true" draggable="false">
                    <img class="photo-main" src="assets/img/foto-demo.jpg" alt="Foto em preto e branco de uma cidade com casas sobre um penhasco, para colorir com a câmera" draggable="false">
                    <canvas class="photo-paint" aria-hidden="true"></canvas>
                    <span class="stage-flash" aria-hidden="true"></span>
                    <p class="stage-hint" data-mouse="Passe o mouse e clique para fotografar" data-touch="Toque na foto para fotografar"></p>
                </div>
            </div>
            <button type="button" class="text-btn" id="photo-clear">Limpar foto</button>
        </div>
    </div>
</section>

<!-- ================= NA PRÁTICA ================= -->
<section class="pratica">
    <p><img class="txt txt-p1" src="assets/img/txt-pratica-1.svg" alt="Com PHOS.EVO você não aprende só a fotografia" draggable="false"></p>
    <p><img class="txt txt-p2" src="assets/img/txt-pratica-2.svg" alt="Você vive na prática" draggable="false"></p>
    <button class="fragment fragment--branca" type="button" data-fragment="saturacao"
            aria-label="Fragmento do obturador escondido. Clique para coletar">
        <img src="assets/img/star-branca.svg" alt="" draggable="false">
    </button>
</section>

<!-- ================= EXPERIMENTO (CTA) ================= -->
<section id="experimento" class="cta">
    <div class="wave wave--top" aria-hidden="true"></div>
    <img class="cta-glow" src="assets/img/brilho-branco.svg" alt="" aria-hidden="true">

    <div class="cta-inner">
        <div class="divider divider--dark" aria-hidden="true">
    <svg class="divider-notch" viewBox="0 0 80 24"><path d="M0 23C28 23 29 2 40 2S52 23 80 23"/></svg>
    <img class="divider-line" src="assets/img/divisor-linha.svg" alt="">
    <img class="divider-star" src="assets/img/divisor-estrela.svg" alt="">
</div>

        <h2 class="cta-title frame reveal">
            <span class="corner tl" aria-hidden="true"></span><span class="corner tr" aria-hidden="true"></span><span class="corner bl" aria-hidden="true"></span><span class="corner br" aria-hidden="true"></span>
            <img class="txt " src="assets/img/txt-cta-titulo.svg" alt="Que tal conhecer a história da fotografia com um" draggable="false">
        </h2>

        <a href="#experimento" class="btn-experiment" id="btn-experiment" data-soon data-light>
            <img src="assets/img/btn-experimento.svg" alt="Experimento" draggable="false">
        </a>
        <img class="chev chev--up" src="assets/img/chevron-cima.svg" alt="" aria-hidden="true">

        <p class="cta-sub"><img class="txt " src="assets/img/txt-cta-sub.svg" alt="Experimente explorar a habilidade de registrar um momento com a fotografia." draggable="false"></p>
    </div>

    <div class="wave wave--bottom" aria-hidden="true"></div>
</section>

<!-- ================= CONTATO ================= -->
<section id="contato" class="contato">
    <div class="contato-wrap">
        <div class="contato-card reveal">
            <img class="contato-flare" src="assets/img/star-branca.svg" alt="" aria-hidden="true">
            <h2>Entre em Contato</h2>

            <ul class="contato-list">
                <li>
                    <a href="tel:+5511930374465" data-light>
                        <span class="ico light-btn light-target"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg></span>
                        <span class="contato-big">55+ 11 93037-4465</span>
                    </a>
                </li>
                <li>
                    <a href="mailto:phos.evolution@gmail.com" data-light>
                        <span class="ico light-btn light-target"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></span>
                        <span>phos.evolution@gmail.com</span>
                    </a>
                </li>
                <li>
                    <div class="contato-row">
                        <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg></span>
                        <span>Brasil - São Paulo</span>
                    </div>
                </li>
            </ul>
        </div>
        <img class="contato-camera" src="assets/img/camera.webp" alt="" draggable="false">
    </div>
</section>

</div>

<footer class="rodape">
    <img class="txt " src="assets/img/txt-copyright.svg" alt="Copyright © 2026 PHOS.EVOLUTION. Todos os direitos reservados." draggable="false">
</footer>

<!-- ================= FERRAMENTA DE CÂMERA (global) ================= -->
<div class="viewfinder" id="viewfinder" aria-hidden="true">
    <i class="vf-ring"></i><i class="vf-cross"></i>
    <span class="vf-c tl"></span><span class="vf-c tr"></span><span class="vf-c bl"></span><span class="vf-c br"></span>
    <span class="vf-info">f/8 · 1/125 · ISO 100</span>
</div>
<div class="cam-dock" id="cam-dock" role="toolbar" aria-label="Funções da câmera"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/phos.js"></script>
<script src="js/camera.js"></script>
</body>
</html>
